<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Screen</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --card: #151515;
      --accent: #e10600;
      --text: #f2f2f2;
      --muted: #b5b5b5;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: grid; place-items: center; }
    .grid { width: min(1200px, 94vw); display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: minmax(120px, auto); gap: 16px; }
    .card { background: var(--card); border-radius: 18px; padding: 18px 20px; box-shadow: 0 10px 30px rgba(0,0,0,.45); position: relative; z-index: 2; }

    .clock { grid-column: span 12; text-align: center; }
    .time { font-size: clamp(48px, 10vw, 96px); font-weight: 700; letter-spacing: 0.06em; }
    .date { margin-top: 6px; color: var(--muted); font-size: 18px; }

    .weather { grid-column: span 5; }

    .calendar { grid-column: span 7; }
    .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .calendar-header button { background: #101010; color: var(--text); border: none; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 16px; }
    .calendar-header button:hover { color: var(--accent); }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 14px; }
    .day { padding: 8px 0; border-radius: 8px; background: #101010; color: var(--muted); }
    .day.header { background: transparent; color: var(--text); font-weight: 600; }
    .day.today { background: rgba(225,6,0,0.25); color: var(--text); font-weight: 700; }

    .waves { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .waves svg { width: 100%; height: 100%; }
    .wave1 { animation: drift 18s linear infinite; }
    .wave2 { animation: drift 28s linear infinite reverse; }
    .wave3 { animation: drift 40s linear infinite; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  </style>
</head>
<body>
  <div class="waves">
    <svg viewBox="0 0 2000 600" preserveAspectRatio="none">
      <defs>
        <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#e10600" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#e10600" stop-opacity="0.05" />
        </linearGradient>
      </defs>
      <path class="wave1" fill="url(#redGlow)" d="M0,300 C250,250 500,350 750,300 1000,250 1250,350 1500,300 1750,250 2000,350 2250,300 L2250,600 L0,600 Z" />
      <path class="wave2" fill="url(#redGlow)" d="M0,340 C300,380 600,260 900,320 1200,380 1500,260 1800,320 2100,380 2400,260 2700,320 L2700,600 L0,600 Z" />
      <path class="wave3" fill="url(#redGlow)" d="M0,380 C400,300 800,420 1200,360 1600,300 2000,420 2400,360 2800,300 3200,420 3600,360 L3600,600 L0,600 Z" />
    </svg>
  </div>

  <main class="grid">
    <section class="card clock">
      <div class="time" id="time">--:--</div>
      <div class="date" id="date">---</div>
    </section>

    <section class="card weather">
      <h2>Weather</h2>
      <div id="weatherapi-weather-widget-5"></div>
      <script type='text/javascript' src='https://www.weatherapi.com/weather/widget.ashx?loc=2640373&wid=5&tu=1&div=weatherapi-weather-widget-5' async></script>
      <noscript>
        <a href="https://www.weatherapi.com/weather/q/philadelphia-2640373">10 day hour by hour Philadelphia weather</a>
      </noscript>
    </section>

    <section class="card calendar">
      <h2>Calendar</h2>
      <div class="calendar-header">
        <button id="prevMonth">‹</button>
        <div id="monthYear"></div>
        <button id="nextMonth">›</button>
      </div>
      <div class="calendar-grid" id="calendar"></div>
    </section>
  </main>

  <script>
    // CLOCK
    function updateClock() {
      const now = new Date();
      document.getElementById('time').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.getElementById('date').textContent = now.toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // CALENDAR
    const calendarEl = document.getElementById('calendar');
    const monthYearEl = document.getElementById('monthYear');
    const prevBtn = document.getElementById('prevMonth');
    const nextBtn = document.getElementById('nextMonth');
    let currentDate = new Date();

    function renderCalendar(date) {
      calendarEl.innerHTML = '';
      const year = date.getFullYear();
      const month = date.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      monthYearEl.textContent = date.toLocaleDateString([], { month: 'long', year: 'numeric' });

      const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      days.forEach(d => { const el = document.createElement('div'); el.className='day header'; el.textContent=d; calendarEl.appendChild(el); });

      for(let i=0;i<firstDay;i++){calendarEl.appendChild(document.createElement('div'));}
      const today = new Date();
      for(let d=1;d<=daysInMonth;d++){
        const el=document.createElement('div'); el.className='day'; el.textContent=d;
        if(d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear()){el.classList.add('today');}
        calendarEl.appendChild(el);
      }
    }

    prevBtn.onclick = () => { currentDate.setMonth(currentDate.getMonth()-1); renderCalendar(currentDate); };
    nextBtn.onclick = () => { currentDate.setMonth(currentDate.getMonth()+1); renderCalendar(currentDate); };
    renderCalendar(currentDate);
  </script>
</body>
</html>
